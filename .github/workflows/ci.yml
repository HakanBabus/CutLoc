name: CutLoc CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install full FFmpeg build
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Check local prerequisites
        run: npm run doctor

      - name: Build all workspaces
        run: npm run build

      - name: Run non-browser tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regression tests
        run: npm run test:web

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-linux-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  windows-verify:
    name: Windows build and browser tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install locked dependencies
        run: npm.cmd ci

      - name: Check local prerequisites
        run: npm.cmd run doctor

      - name: Build all workspaces
        run: npm.cmd run build

      - name: Run non-browser tests
        run: npm.cmd test

      - name: Install Playwright Chromium
        run: npx.cmd playwright install chromium

      - name: Run browser regression tests
        run: npm.cmd run test:web

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-windows-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
