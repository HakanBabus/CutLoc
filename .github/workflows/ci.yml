name: CutLoc CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Run non-browser tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regression tests
        run: npm run test:web

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  windows-verify:
    name: Windows build and non-browser tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install locked dependencies
        run: npm.cmd ci

      - name: Check local prerequisites
        run: npm.cmd run doctor

      - name: Build all workspaces
        run: npm.cmd run build

      - name: Run non-browser tests
        run: npm.cmd test
